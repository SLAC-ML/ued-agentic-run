# UED setup for the bring-up tools: taught positions, camera views, laser and
# collimator setpoints, and the safety ranges every write is checked against.
#
# One editable file for the agent and the operators (Fuhao's automation
# notes 5b and 5d). This is the reviewed seed in the ued-agentic-run repo;
# the live copy the tools read is $UED_SETUP_FILE, by default
# /sdf/group/mli/zhezhang/ued/agentic/config/ued_setup.yaml. Edit the live
# copy during a shift; copy changes back here when they should stick.
#
# Units are the machine's: mm and deg for motors, s for exposures.
# null means "not known yet": a tool that needs it stops and asks.

# Taught sample-stage positions (1st chamber SUED stage), one line each:
#   name: {x: .., y: .., z: .., pump_hwp_deg: .., note: "..."}
# x, y, z in mm; an axis left out isn't moved. The tools never move the
# sample pitch or yaw: set them by hand. Extra
# fields (a note, a hand-set pitch/yaw to remember) are allowed, kept on
# re-save, and never moved; pump_hwp_deg is the one go_to applies (the pump
# energy for that sample, Xinxin's per-sample HWP).
# The ONE place for positions: the agent (save_position tool) and operators
# (bringup/positions.py: list, where, save, set, check, history) write it
# through the same code, with safety ranges checked, a .bak copy and
# ued_setup.history.log. Hand edits are fine; run `positions.py check` after.
# Run 4's coordinates were on the GUED stage and don't carry over.
positions:
  yag: null      # sample-chamber YAG screen ("go2YAG"), where the e-beam cross is
  andor: null    # sample card out, cross in free space ("go2Andor"), beam to the far detector
  bi: null       # Bi sample ("go2Bi")
  si: null       # Si sample

# Sample chamber camera (UED:GIGE:02) plus the chamber light, the three
# states of Fuhao's procedure. ebeam and laser may need retuning for other
# pulse charges and pump wavelengths. Procedure (4) step 4 says gain 30 for
# the e-beam view; the state list says 10.
camera_views:
  full_view: {exposure: 0.1, gain: 0, light: 1}     # state 1: sample chamber full view
  ebeam: {exposure: 1.0, gain: 10, light: 0}        # state 2: e-beam on the YAG
  laser: {exposure: 0.5, gain: 5, light: 0}         # state 3: pump laser on the YAG
  # Xinxin's Run 6 presets for the same camera (no light change):
  high: {exposure: 1.5, gain: 18}
  mid: {exposure: 0.2, gain: 5}                     # set before every stage move
  low: {exposure: 0.02, gain: 0}

# Stage moves (go_to), as in Xinxin's go2... functions: pump and gun UV
# shutters closed first, the sample camera to this view, the position's
# pump_hwp_deg (if it has one) applied, x/y/z moved, then the gun UV
# reopened if it was open. null skips the camera view.
motion:
  camera_view: mid

# Far-detector Andor (UED:ANDOR:CAM:03): stopped, set, started again.
andor:
  check: {exposure: 1.0, gain: 2}            # beam check, collimator scans
  diffraction: {exposure: 2.0, gain: 1000}   # Bi; set per sample
  through_hole_px: null       # [x, y] of the main-beam through hole on the Andor image
  through_hole_radius_px: null

# Pump laser. HWP angles come from the laser team before the experiment.
pump:
  # Run 6 values from Xinxin's code (2026-06): hwpAngle_YAG and hwpAngle_Bi.
  # The pump energy drifts run to run: confirm with the laser team.
  # From the 2026-10-28 calibration (bringup/pump_calibration/, throttle 16 deg)
  hwp_min_energy_deg: 8.0     # near the minimum, for overlap on the YAG
  hwp_pump_probe_deg: 22.0    # ~2.2 uJ at PM1, 2.3 mJ/cm^2 peak: time zero on Bi
  power_meter_out_mm: 0.0
  power_meter_in_mm: 40.0
  # 1st chamber outcoupling mirror (UED:USR:MMN:04:02): its OUT and IN
  # positions, for the readiness check. Read them on the machine. Xinxin's
  # earlier runs: OUT ~0.1-1, IN ~18-24 (her rule: IN when > 17).
  outcoupling_out_mm: null
  outcoupling_in_mm: null

# Time zero (stage 8, find_time_zero): the Bi pump-probe signal and the two
# scan methods. Values from the 2026-04-08 beamtime (Fuhao's
# bi_pp_signal_2026.py, Sam's posterior_sampling.ipynb, ued_tuning repo):
# confirm them on the machine. The signal at a delay is Delta I/I (%) at a
# Bi ring from Andor frames taken pump ON, OFF, OFF, ON.
time_zero:
  # Direction of the drop on the pump long delay (UED:USR:MMN:03:04): in
  # April the Bi signal dropped below t0 ~189 mm, i.e. toward lower delay.
  signal_drops_toward: lower      # lower | higher
  # Andor image analysis (applies to both methods on the real machine)
  ring_s: 7.30                    # 1/A, the Bi ring used (others: 2.78, 4.81)
  ring_half_width: 8              # radial bins either side of the ring
  s_cal: 0.01924                  # 1/A per pixel (calibrated 2026-04-06)
  hole_mask_px: [501, 518, 45]    # [x, y, r]: the through hole, NaN-masked
  corner_px: 30                   # corner squares for the background median
  ring_center_px: null            # [x, y]; null = find it at the start from
                                  # 5 pump-off frames (Dec 2025: [498.1, 521.9])
  ring_search_px: {r_min: 80, r_max: 450, hole_radius: 50}
  frame_wait_exposures: 2         # wait 2 x exposure after a shutter toggle
  n_avg: 1                        # ON/OFF/OFF/ON repeats per point (April run 4: 5)
  move_s_per_mm: 0.12             # delay-stage wait per mm moved, plus settle_s
  settle_s: 1.0
  min_drop_pct: 1.0               # smallest drop accepted as a time-zero step
  # method='boed' (amortized posterior sampling, models boed/models/delay_t0_2026-04)
  boed_window_mm: [170.0, 210.0]  # scan window; the models cover ~5-260 ps,
                                  # so keep it near 40 mm (266 ps) and t0 inside
  boed_y_shift: 3.0               # added to Delta I/I so the before-t0 baseline
                                  # sits at 0, as the models expect. April: 3.0
                                  # (runs 1, 3), 3.5 (run 2), 0.5 (low signal).
                                  # The result's check suggests a value.
  boed_y_scale: 1.0               # then multiplied in, to bring the drop near
  boed_reference_drop_pct: 4.4    # this: April's drop, where the models worked
                                  # (in simulation they went wrong at 8 %).
  y_shift_tolerance: 1.0          # note in the result if the baseline is off by more
  boed_n_points: 80               # points per run: 10 grid + 70 from the posterior
  boed_grid_steps: 10
  boed_block_size: 10             # the model advances one round per block
  boed_max_width_mm: 0.5          # stop for an operator if the 98 % interval
                                  # is wider (April, 80 points: 0.3-0.7 mm)
  check_margin_mm: 0.5            # check: points this far either side of t0
  boed_param_bounds_ps: null      # t0 normalization; null = the models' own
                                  # [5, 260]. The April notebook used [0, 266].
  # method='eig' (non-amortized BOED, boed/delay_eig.py): a posterior refit
  # every point, the next point where the expected information gain is
  # highest. Priors are Normal [loc, scale], April's (boed_double_exp_2-stage).
  eig_window_mm: [170.0, 210.0]
  eig_n_points: 30                # 10 grid + 20 (as in April)
  eig_grid_steps: 10
  eig_max_width_mm: 0.5           # stop for an operator if the 98 % interval is wider
  eig_priors:
    t0_mm: [190.0, 10.0]
    a1: [1.0, 0.5]                # fast part of the drop, % Delta I/I
    tau1_ps: [0.1, 0.1]
    a2: [4.0, 1.0]                # slow part
    tau2_ps: [1.0, 1.0]
    baseline: [-3.5, 0.5]         # Delta I/I before t0, %
    irf_ps: [0.1, 0.1]            # instrument response width
  eig_noise_prior: [-0.7, 0.75]   # LogNormal [mu, sigma] of the noise, %:
                                  # median 0.5 (April: 0.4-1). April pinned it at 0.135
  eig_margin_mm: 0.5              # next point among delays within t0's 98 %
                                  # interval + this: a heuristic, not April's (the
                                  # EIG is about all 7 parameters, and over the
                                  # whole window it goes for the decay tail once t0
                                  # is known). null = the whole window, as April.
  eig_candidates: 1000
  eig_train_steps: 3000
  eig_starts: 5                   # t0 starting points for each fit, across the window

collimator:
  out_mm: 0.0
  nominal_mm: 90.0            # the 200 um hole
  scan_half_width_mm: 0.5     # tuning range around nominal

gun:
  # Stage-1 ramp from AREQ 0.05 to the target. 600 steps x 2 s = 20 min,
  # half the step size of the original 300 x 2 s (10 min) ramp_rf.py, for
  # the reduced gun cooling-water flow (2026-10-28). Smaller steps first,
  # longer dwell second: the temperature check runs before every step.
  ramp_n_steps: 600
  ramp_dwell_s: 2.0
  # Gun body temperature window: the ramp holds before a step while the
  # temperature is outside it, and aborts (AREQ -> 0) after 10 readings in a
  # row outside. 33-37 C as in Joel's ramp_rf.py: the gun idled at 36.4 C
  # with the RF off on 2026-10-28, so a 36 C ceiling would abort at once.
  ramp_temp_min_C: 33.0
  ramp_temp_max_C: 37.0
  uv_throttle_scan_deg: 51    # higher UV for the emission-phase scan
  uv_throttle_operating_deg: 53
  phase_from_emission_deg: 30
  target_charge_fC: 10

# Oscilloscope with the bunch-charge pulse. The dry run confirmed CH2 (its
# V/div PV is MBBO_CH2_SCL, which Fuhao gave); his procedure text names
# WF_CH0_TRACE. channel picks the one the tools read.
scope:
  channel: 2
  mV_per_fC: -0.17            # -1.7 mV below baseline = 10 fC

# The e-beam on the YAG should sit near the cross. Within this distance the
# tools move the cross onto the beam; farther, an operator decides.
cross:
  on_cross_px: 5
  max_move_px: 150

# Safety ranges, checked before every write the tools make (note 5d).
# Seeded 2026-10-21 from the motors' soft limits (HLM/LLM) and the magnets'
# drive limits (DRVH/DRVL), read from ued-daq. The pump HWP and the UV
# throttle have no useful IOC limits (+/-1e6, +/-180); their ranges below are
# placeholders to confirm. Correctors are in BCTRL units on the real machine.
limits:
  # Sample stage: new PVs on 2026-10-28 (x UM1:MMS:02, y MMN:04:01, z
  # UM1:MMS:01). The earlier ranges were XPS-11's (jet hardware) and are
  # gone. Read 2026-10-28: y has IOC soft limits 0..25 (used below); the IMS
  # motors x, z (and yaw) have LLM = HLM = 0, i.e. no IOC soft limits, so
  # these ranges are their only software limit: set them from the travel
  # the sample holder allows (null = not set yet, listed by `check`).
  sample_x: null
  sample_y: [0.0, 25.0]
  sample_z: null
  # Pitch (MMN:04:04) and yaw (UM1:MMS:03): read-only for the tools for
  # now; kept for when they aren't (small angles, up to ~5 deg).
  sample_pitch: [-5.0, 5.0]
  sample_yaw: [-5.0, 5.0]
  collimator: [0.0, 96.0]
  delay: [0.0, 300.0]
  pump_hwp: [0.0, 180.0]          # placeholder
  pump_nd_wheel: [40.0, 370.0]
  pump_power_meter: [0.0, 40.1]
  pump_lens_h: [0.0, 25.0]
  pump_lens_v: [0.0, 25.0]
  gun_uv_throttle: [45.0, 60.0]   # placeholder
  areq: [0.0, 0.53]
  preq: [-180.0, 180.0]
  sol1: [0.0, 0.55]
  sol2: [0.0, 15.0]
  xc00: [-521.0, 521.0]
  yc00: [-220.0, 220.0]
  xc01: [-107.5, 107.5]
  yc01: [-110.0, 110.0]
  xc02: [-35.9, 35.9]
  yc02: [-39.0, 39.0]
  xc03: [-120.0, 120.0]
  yc03: [-120.0, 120.0]
  xc04: [-12.0, 12.0]
  yc04: [-12.0, 12.0]
  cam_sample_yag.cross_x: [0, 2048]
  cam_sample_yag.cross_y: [0, 2048]
